---
layout: default
title: Home
---

<h1>Scott Radcliff</h1>
<p class="meta">Software Engineer</p>

{% for post in site.posts %}
  <div class="post-preview">
    <h2>
      <a href="{{ post.url | relative_url }}">
        {{ post.title }}
      </a>
    </h2>
    <p class="meta">
      {{ post.date | date: "%B %d, %Y" }}
    </p>
    <p>
      {{ post.excerpt | strip_html | truncate: 160 }}
    </p>
  </div>
{% endfor %}
